<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>LOVE CALCULATOR — ADMIN PANEL</title>
<style>
:root{--p:#ff4d8d;--v:#a78bfa;--t:#2b1a33}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:#fff}
.hidden{display:none!important}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--p),var(--v))}button.s{background:#fff0f6;color:#d6195f;border:1px solid #ffc2da}button.d{background:#d6195f}button:disabled{opacity:.4}
input,select{font:inherit;padding:8px 10px;border:1px solid #f3c4d8;border-radius:10px;max-width:100%}
#login{max-width:360px;margin:12vh auto;padding:26px;border:1px solid #ffd3e4;border-radius:20px;box-shadow:0 8px 30px #ff4d8d22}#login input{width:100%;margin:6px 0}
#app{display:flex;min-height:100vh}
aside{width:210px;background:#fff5f9;border-right:1px solid #ffd3e4;padding:16px;flex-shrink:0}aside h3{margin:0 0 14px;font-size:15px;color:#d6195f}
aside a{display:block;padding:10px 12px;border-radius:10px;color:var(--t);cursor:pointer;margin-bottom:4px;font-size:14px}aside a.on,aside a:hover{background:#ffe0ee;font-weight:600}
main{flex:1;padding:18px;min-width:0}.top{display:flex;gap:10px;align-items:center}#menu{display:none}
h1{font-size:20px;margin:0}.sub{color:#7a6683;font-size:13px;margin:2px 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
.c{padding:14px;border:1px solid #ffd3e4;border-radius:16px;box-shadow:0 4px 14px #ff4d8d14}.c b{display:block;font-size:24px;color:var(--p)}.c span{font-size:12px;color:#7a6683}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.tw{overflow-x:auto;border:1px solid #ffd3e4;border-radius:14px}table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}th{background:#fff0f6;text-align:left}th,td{padding:9px 10px;border-bottom:1px solid #ffe6f0}
.ch{display:flex;align-items:flex-end;gap:3px;height:120px;padding:10px;border:1px solid #ffd3e4;border-radius:14px}.ch i{flex:1;background:linear-gradient(var(--p),var(--v));border-radius:4px 4px 0 0;min-height:2px}
dialog{border:0;border-radius:18px;padding:22px;box-shadow:0 10px 50px #0004;max-width:92vw}
.msg{padding:10px;border-radius:10px;background:#fff0f6;margin:10px 0;font-size:13px}.spin{text-align:center;padding:20px;color:var(--p)}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:.25s}aside.open{transform:none;box-shadow:0 0 40px #0005}#menu{display:inline-block}}
</style></head><body>

<div id="login"><h1>LOVE CALCULATOR — ADMIN PANEL</h1><p class="sub">Manage calculations, private records, and website activity.</p>
<input id="em" type="email" placeholder="Admin email" autocomplete="username">
<div style="display:flex;gap:6px"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="s" id="eye" type="button">Show</button></div>
<div class="msg hidden" id="lerr"></div><button id="lg" style="width:100%;margin-top:8px">Login</button></div>

<div id="app" class="hidden">
<aside id="side"><h3>💗 ADMIN PANEL</h3>
<a data-v="dash" class="on">Dashboard</a><a data-v="rec">Records (Names)</a><a data-v="rank">Love Rank Activity</a><a data-v="share">Share Links</a><a data-v="set">Settings</a></aside>
<main><div class="top"><button id="menu" class="s">☰</button><div><h1>LOVE CALCULATOR — ADMIN PANEL</h1><div class="sub">Manage calculations, private records, and website activity.</div></div></div>
<div id="view"></div></main></div>
<dialog id="dlg"><div id="dmsg"></div><div class="bar" style="justify-content:flex-end"><button class="s" id="dno">Cancel</button><button class="d" id="dyes">OK</button></div></dialog>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,setPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy,limit,writeBatch,doc,updateDoc} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCDtMZL2mApGy5oXPKnHZxz6fXxFG6PI-s",authDomain:"anonymous-message-e44e3.firebaseapp.com",projectId:"anonymous-message-e44e3",storageBucket:"anonymous-message-e44e3.firebasestorage.app",messagingSenderId:"779609497076",appId:"1:779609497076:web:9e7b1f7e648de8887ceda1",measurementId:"G-6PD0FMTTM4"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),IDLE=30*60*1000;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=ms=>ms?new Date(ms).toLocaleString():"-";
let user,idle,data={},st={page:1,sel:new Set(),f:{}};

/* ===== auth ===== */
$("eye").onclick=()=>{const p=$("pw");p.type=p.type==="password"?"text":"password";$("eye").textContent=p.type==="password"?"Show":"Hide"};
const lerr=m=>{const e=$("lerr");e.textContent=m;e.classList.remove("hidden")};
let fails=0,lock=0;
$("lg").onclick=async()=>{if(Date.now()<lock)return lerr("Too many attempts. Wait a minute.");
 try{await setPersistence(auth,browserSessionPersistence);await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);fails=0}
 catch(e){if(++fails>=5){lock=Date.now()+60000;fails=0}lerr("Invalid email or password.")}};
$("pw").onkeydown=e=>e.key==="Enter"&&$("lg").click();
onAuthStateChanged(auth,async u=>{user=u;
 if(!u){$("app").classList.add("hidden");$("login").classList.remove("hidden");return}
 try{await load()}catch(e){await signOut(auth);lerr("This account is not authorized.");return}
 $("login").classList.add("hidden");$("app").classList.remove("hidden");go("dash");bump()});
const bump=()=>{clearTimeout(idle);idle=setTimeout(()=>signOut(auth),IDLE)};
["click","keydown","touchstart"].forEach(e=>addEventListener(e,()=>user&&bump()));

/* ===== data (Firestore rules enforce admin-only) ===== */
async function load(){
 const g=async c=>(await getDocs(query(collection(db,c),orderBy("t","desc"),limit(2000)))).docs.map(d=>({id:d.id,...d.data(),ms:d.data().t?.toMillis?.()||0}));
 const [records,ranks,shares]=await Promise.all([g("records"),g("ranks"),g("shares")]);
 data={records,ranks,shares}}

/* ===== ui helpers ===== */
const box=(m,cancel=true)=>new Promise(r=>{$("dmsg").innerHTML=m;$("dno").classList.toggle("hidden",!cancel);$("dlg").showModal();$("dyes").onclick=()=>{$("dlg").close();r(true)};$("dno").onclick=()=>{$("dlg").close();r(false)}});
const cardsH=o=>`<div class="cards">${o.map(([l,v])=>`<div class="c"><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>`;
const chartH=a=>{const m=Math.max(1,...a.map(x=>x.n));return`<div class="ch">${a.map(x=>`<i title="${esc(x.d)}: ${x.n}" style="height:${x.n/m*100}%"></i>`).join("")}</div>`};
const dayStart=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
async function del(col,ids,after){if(!ids.length||!await box(`Permanently delete ${ids.length} item(s)?`))return;
 for(let i=0;i<ids.length;i+=400){const b=writeBatch(db);ids.slice(i,i+400).forEach(id=>b.delete(doc(db,col,id)));await b.commit()}
 await load();after()}
$("menu").onclick=()=>$("side").classList.toggle("open");
document.querySelectorAll("aside a").forEach(a=>a.onclick=()=>{document.querySelectorAll("aside a").forEach(x=>x.classList.remove("on"));a.classList.add("on");$("side").classList.remove("open");go(a.dataset.v)});
const V={dash,rec,rank,share,set};
function go(v){st.page=1;st.sel.clear();try{V[v]()}catch(e){$("view").innerHTML=`<div class="msg">Error: ${esc(e.message)}</div>`}}

/* ===== views ===== */
function dash(){const R=data.records,t0=dayStart(),days=[];
 for(let i=13;i>=0;i--){const s=t0-i*864e5;days.push({d:new Date(s).toLocaleDateString(),n:R.filter(r=>r.ms>=s&&r.ms<s+864e5).length})}
 const avg=R.length?Math.round(R.reduce((a,r)=>a+r.pct,0)/R.length):0;
 const dist=Array.from({length:10},(_,i)=>({d:`${i*10+1}-${i*10+10}%`,n:R.filter(r=>Math.ceil(r.pct/10)-1===i).length}));
 $("view").innerHTML=`<div class="bar"><button class="s" id="rf">↻ Refresh</button></div>`+
 cardsH([["Total Calculations",R.length],["Today",R.filter(r=>r.ms>=t0).length],["Last 7 Days",R.filter(r=>r.ms>=t0-6*864e5).length],["Average Score",avg+"%"],["Love Rank Searches",data.ranks.length],["Share Links Created",data.shares.length],["Share Link Visits",data.shares.reduce((a,s)=>a+(s.v||0),0)]])+
 `<h3>Calculations — last 14 days</h3>${chartH(days)}<h3>Score distribution</h3>${chartH(dist)}<h3>Recent</h3><div class="tw"><table><tr><th>Time</th><th>Person A</th><th>Crush</th><th>%</th></tr>${R.slice(0,8).map(r=>`<tr><td>${fmt(r.ms)}</td><td>${esc(r.a)}</td><td>${esc(r.b)}</td><td>${r.pct}%</td></tr>`).join("")||"<tr><td colspan=4>No data yet</td></tr>"}</table></div>`;
 $("rf").onclick=async()=>{await load();dash()}}

function rec(){const f=st.f;
 $("view").innerHTML=`<h2>PRIVATE CALCULATION RECORDS</h2><div class="bar">
 <input id="q" placeholder="Search by name or crush name..." value="${esc(f.q||"")}">
 <input id="d1" type="date" value="${f.from||""}"><input id="d2" type="date" value="${f.to||""}">
 <input id="p1" type="number" min="1" max="100" placeholder="Min %" style="width:80px" value="${f.min||""}"><input id="p2" type="number" min="1" max="100" placeholder="Max %" style="width:80px" value="${f.max||""}">
 <select id="g"><option value="">Any gender</option><option ${f.g==="Male"?"selected":""}>Male</option><option ${f.g==="Female"?"selected":""}>Female</option></select>
 <select id="so"><option value="desc">Newest</option><option value="asc" ${f.so==="asc"?"selected":""}>Oldest</option></select>
 <button id="ap">Apply</button><button class="s" id="cl">Clear</button><button class="d" id="ds">Delete selected</button></div><div id="tb"></div><div class="bar" id="pg"></div>`;
 $("ap").onclick=()=>{st.f={q:$("q").value.trim().toLowerCase(),from:$("d1").value,to:$("d2").value,min:$("p1").value,max:$("p2").value,g:$("g").value,so:$("so").value};st.page=1;st.sel.clear();draw()};
 $("cl").onclick=()=>{st.f={};st.page=1;rec()};
 $("ds").onclick=()=>del("records",[...st.sel],()=>{st.sel.clear();draw()});draw();
 function draw(){const f=st.f;let L=data.records.filter(r=>(!f.q||(r.a+" "+r.b).toLowerCase().includes(f.q))&&(!f.from||r.ms>=new Date(f.from).getTime())&&(!f.to||r.ms<new Date(f.to).getTime()+864e5)&&(!f.min||r.pct>=+f.min)&&(!f.max||r.pct<=+f.max)&&(!f.g||r.ag===f.g||r.bg===f.g));
  if(f.so==="asc")L=[...L].reverse();const P=20,pages=Math.max(1,Math.ceil(L.length/P));if(st.page>pages)st.page=pages;
  $("tb").innerHTML=`<div class="tw"><table><tr><th></th><th>Record ID</th><th>Person A</th><th>Gender</th><th>Crush</th><th>Gender</th><th>%</th><th>Date</th><th>Actions</th></tr>${L.slice((st.page-1)*P,st.page*P).map(r=>`<tr><td><input type="checkbox" data-id="${esc(r.id)}" ${st.sel.has(r.id)?"checked":""}></td><td>${esc(r.id.slice(0,8))}…</td><td>${esc(r.a)}</td><td>${esc(r.ag)}</td><td>${esc(r.b)}</td><td>${esc(r.bg)}</td><td>${r.pct}%</td><td>${fmt(r.ms)}</td><td><button class="s" data-v="${esc(r.id)}">View</button> <button class="d" data-x="${esc(r.id)}">Delete</button></td></tr>`).join("")||"<tr><td colspan=9>No records</td></tr>"}</table></div>`;
  $("pg").innerHTML=`<button class="s" id="pv" ${st.page<2?"disabled":""}>‹ Prev</button> Page ${st.page}/${pages} · ${L.length} records <button class="s" id="nx" ${st.page>=pages?"disabled":""}>Next ›</button>`;
  $("pv").onclick=()=>{st.page--;draw()};$("nx").onclick=()=>{st.page++;draw()};
  $("tb").querySelectorAll("[data-id]").forEach(c=>c.onchange=()=>c.checked?st.sel.add(c.dataset.id):st.sel.delete(c.dataset.id));
  $("tb").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>del("records",[b.dataset.x],draw));
  $("tb").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{const r=data.records.find(x=>x.id===b.dataset.v);
   box(`<h3>Record details</h3><p><b>Person A:</b> ${esc(r.a)} (${esc(r.ag)})<br><b>Crush:</b> ${esc(r.b)} (${esc(r.bg)})<br><b>Score:</b> ${r.pct}%<br><b>Submitted:</b> ${fmt(r.ms)}<br><b>ID:</b> ${esc(r.id)}</p>`,false)})}}

function rank(){$("view").innerHTML=`<h2>LOVE RANK ACTIVITY</h2>${cardsH([["Love Rank searches",data.ranks.length]])}<div class="bar"><button class="d" id="da">Delete all</button></div><div class="tw"><table><tr><th>ID</th><th>Date</th><th>Name</th><th>Gender</th><th>Rank</th><th></th></tr>${data.ranks.slice(0,200).map(r=>`<tr><td>${esc(r.id.slice(0,8))}…</td><td>${fmt(r.ms)}</td><td>${esc(r.n)}</td><td>${esc(r.g)}</td><td>${esc(r.cat)}</td><td><button class="d" data-x="${esc(r.id)}">Delete</button></td></tr>`).join("")||"<tr><td colspan=6>No activity</td></tr>"}</table></div>`;
 $("da").onclick=()=>del("ranks",data.ranks.map(r=>r.id),rank);
 $("view").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>del("ranks",[b.dataset.x],rank))}

function share(){const now=Date.now(),status=s=>!s.active?"revoked":s.exp.toMillis()<now?"expired":"active";
 $("view").innerHTML=`<h2>SHARE LINK ANALYTICS</h2>${cardsH([["Links created",data.shares.length],["Active",data.shares.filter(s=>status(s)==="active").length],["Total visits",data.shares.reduce((a,s)=>a+(s.v||0),0)]])}<div class="tw"><table><tr><th>Share ID</th><th>Score</th><th>Created</th><th>Expires</th><th>Status</th><th>Visits</th><th></th></tr>${data.shares.slice(0,200).map(s=>`<tr><td>${esc(s.id.slice(0,8))}…</td><td>${s.pct}%</td><td>${fmt(s.ms)}</td><td>${fmt(s.exp.toMillis())}</td><td>${status(s)}</td><td>${s.v||0}</td><td>${status(s)==="active"?`<button class="s" data-r="${esc(s.id)}">Revoke</button> `:""}<button class="d" data-x="${esc(s.id)}">Delete</button></td></tr>`).join("")||"<tr><td colspan=7>No links</td></tr>"}</table></div>`;
 $("view").querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{if(await box("Revoke this link?")){await updateDoc(doc(db,"shares",b.dataset.r),{active:false});await load();share()}});
 $("view").querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>del("shares",[b.dataset.x],share))}

function set(){$("view").innerHTML=`<h2>Settings</h2><div class="c" style="max-width:440px"><p><b>Account:</b> ${esc(user.email)}</p><p><b>Session:</b> auto-logout after ${IDLE/60000} min idle; cleared when tab closes.</p>
 <p><b>Delete old records</b><br><input id="dd" type="number" min="1" value="90" style="width:80px"> days <button class="d" id="po">Delete older</button></p>
 <div class="bar"><button class="s" id="rf">↻ Refresh data</button><button id="lo">Logout</button></div></div>`;
 $("rf").onclick=async()=>{await load();toast()};$("lo").onclick=()=>signOut(auth);
 $("po").onclick=()=>{const c=Date.now()-(+$("dd").value||90)*864e5;del("records",data.records.filter(r=>r.ms<c).map(r=>r.id),set)};
 const toast=()=>box("Refreshed.",false)}
</script></body></html>
